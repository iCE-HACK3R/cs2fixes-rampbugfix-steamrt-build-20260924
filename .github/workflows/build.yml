name: Build CS2Fixes RampbugFix ABI18

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'artifacts/**'

concurrency:
  group: rampbugfix-abi18-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    container: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    env:
      HL2SDKCS2: ${{ github.workspace }}/CS2Fixes-RampBugFix/sdk
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4
        with:
          path: buildrepo
          persist-credentials: true

      - name: Checkout RampbugFix
        uses: actions/checkout@v4
        with:
          repository: Interesting-exe/CS2Fixes-RampBugFix
          ref: main
          path: CS2Fixes-RampBugFix
          submodules: recursive
          fetch-depth: 0

      - name: Checkout Metamod 2.0.0.1469
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/metamod-source
          ref: 2.0.0.1469
          path: mmsource-2.0
          submodules: recursive

      - name: Checkout KHook headers separately
        uses: actions/checkout@v4
        with:
          repository: Kenzzer/KHook
          ref: master
          path: khook-source
          fetch-depth: 1

      - name: Checkout AMBuild
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/ambuild
          ref: master
          path: ambuild-source
          fetch-depth: 1

      - name: Install KHook into Metamod tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/mmsource-2.0/third_party/khook"
          mkdir -p "$GITHUB_WORKSPACE/mmsource-2.0/third_party/khook"
          cp -a "$GITHUB_WORKSPACE/khook-source/." "$GITHUB_WORKSPACE/mmsource-2.0/third_party/khook/"
          test -s "$GITHUB_WORKSPACE/mmsource-2.0/third_party/khook/include/khook.hpp"

      - name: Add Metamod ABI18 compatibility includes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          build_script = Path('CS2Fixes-RampBugFix/AMBuildScript')
          text = build_script.read_text()
          needle = "      os.path.join(mms_core_path, 'sourcehook'),"
          addition = needle + "\n      os.path.join(mms_root, 'third_party', 'khook', 'include'),"
          if "os.path.join(mms_root, 'third_party', 'khook', 'include')" not in text:
              if needle not in text:
                  raise SystemExit('AMBuildScript include anchor not found')
              build_script.write_text(text.replace(needle, addition, 1))

          header = Path('CS2Fixes-RampBugFix/src/cs2fixes.h')
          header_text = header.read_text()
          sourcehook = '#include "sourcehook.h"\n'
          if sourcehook not in header_text:
              anchor = '#include <ISmmPlugin.h>\n'
              if anchor not in header_text:
                  raise SystemExit('ISmmPlugin include anchor not found')
              header.write_text(header_text.replace(anchor, anchor + sourcehook, 1))
          PY

      - name: Install AMBuild and clang
        shell: bash
        run: |
          set +e
          {
            set -x
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends clang-16 python3-setuptools
            ln -sf /usr/bin/clang-16 /usr/bin/clang
            ln -sf /usr/bin/clang++-16 /usr/bin/clang++
            if [ ! -f "$GITHUB_WORKSPACE/ambuild-source/setup.py" ]; then
              rm -rf "$GITHUB_WORKSPACE/ambuild-source"
              git clone --depth 1 https://github.com/alliedmodders/ambuild.git "$GITHUB_WORKSPACE/ambuild-source"
            fi
            test -f "$GITHUB_WORKSPACE/ambuild-source/setup.py"
            cd "$GITHUB_WORKSPACE/ambuild-source"
            python3 setup.py install --user
            test -x "$HOME/.local/bin/ambuild"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          } 2>&1 | tee "$GITHUB_WORKSPACE/install-build-tools.log"
          exit ${PIPESTATUS[0]}

      - name: Build package
        working-directory: CS2Fixes-RampBugFix
        shell: bash
        run: |
          set +e
          {
            export PATH="$HOME/.local/bin:$PATH"
            echo '=== env ==='
            pwd
            ls -la
            echo "PATH=$PATH"
            echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
            echo "HL2SDKCS2=$HL2SDKCS2"
            echo '=== build ==='
            rm -rf build
            mkdir -p build
            cd build
            python3 ../configure.py --enable-optimize --sdks cs2 --targets=x86_64
            command -v ambuild
            ambuild
            echo '=== all generated native files ==='
            find . -type f -size +1k -print -exec file {} ';' -exec sha256sum {} ';'
            echo '=== locate RampBugFix ELF ==='
            while IFS= read -r candidate; do
              if file "$candidate" | grep -q 'ELF 64-bit.*x86-64'; then
                echo "Using native binary: $candidate"
                mkdir -p package/addons/cs2fixes-rampbugfix/bin/linuxsteamrt64
                cp "$candidate" package/addons/cs2fixes-rampbugfix/bin/linuxsteamrt64/cs2fixes-rampbugfix.so
                break
              fi
            done < <(find . -type f \( -name 'cs2fixes-rampbugfix' -o -name 'cs2fixes-rampbugfix.so' \))
            echo '=== package contents ==='
            find package -maxdepth 8 -type f -print -exec file {} ';' -exec sha256sum {} ';'
            test -s package/addons/cs2fixes-rampbugfix/bin/linuxsteamrt64/cs2fixes-rampbugfix.so
            file package/addons/cs2fixes-rampbugfix/bin/linuxsteamrt64/cs2fixes-rampbugfix.so | grep -E 'ELF 64-bit.*x86-64'
            tar -C package -czf ../CS2Fixes-RampbugFix-abi18-steamrt.tar.gz .
            sha256sum ../CS2Fixes-RampbugFix-abi18-steamrt.tar.gz | tee ../CS2Fixes-RampbugFix-abi18-steamrt.tar.gz.sha256
            tar -tzf ../CS2Fixes-RampbugFix-abi18-steamrt.tar.gz | grep -Fx 'addons/cs2fixes-rampbugfix/bin/linuxsteamrt64/cs2fixes-rampbugfix.so'
          } 2>&1 | tee "$GITHUB_WORKSPACE/rampbugfix-build.log"
          exit ${PIPESTATUS[0]}

      - name: Upload full build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rampbugfix-build-${{ github.run_id }}
          path: |
            ${{ github.workspace }}/install-build-tools.log
            ${{ github.workspace }}/rampbugfix-build.log
            ${{ github.workspace }}/CS2Fixes-RampBugFix/build
          if-no-files-found: warn
          retention-days: 7

      - name: Commit artifact or failure log
        if: always()
        shell: bash
        run: |
          buildrepo="$GITHUB_WORKSPACE/buildrepo"
          mkdir -p "$buildrepo/artifacts"
          rm -f "$buildrepo/artifacts/CS2Fixes-RampbugFix-abi18-steamrt.tar.gz" "$buildrepo/artifacts/CS2Fixes-RampbugFix-abi18-steamrt.tar.gz.sha256" "$buildrepo/artifacts/rampbugfix-build.log" "$buildrepo/artifacts/install-build-tools.log"
          archive=$(find "$GITHUB_WORKSPACE/CS2Fixes-RampBugFix" -type f -name 'CS2Fixes-RampBugFix-abi18-steamrt.tar.gz' -size +1k | head -n1)
          if [ -n "$archive" ] && tar -tzf "$archive" | grep -Fxq 'addons/cs2fixes-rampbugfix/bin/linuxsteamrt64/cs2fixes-rampbugfix.so'; then
            cp "$archive" "$buildrepo/artifacts/CS2Fixes-RampBugFix-abi18-steamrt.tar.gz"
            cp "${archive}.sha256" "$buildrepo/artifacts/CS2Fixes-RampBugFix-abi18-steamrt.tar.gz.sha256"
          fi
          if [ -s "$GITHUB_WORKSPACE/rampbugfix-build.log" ]; then cp "$GITHUB_WORKSPACE/rampbugfix-build.log" "$buildrepo/artifacts/rampbugfix-build.log"; fi
          if [ -s "$GITHUB_WORKSPACE/install-build-tools.log" ]; then cp "$GITHUB_WORKSPACE/install-build-tools.log" "$buildrepo/artifacts/install-build-tools.log"; fi
          git -C "$buildrepo" config user.name 'github-actions[bot]'
          git -C "$buildrepo" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$buildrepo" add -f artifacts || true
          if git -C "$buildrepo" diff --cached --quiet; then
            echo 'No artifact/log changes to commit.'
          else
            git -C "$buildrepo" commit -m 'Publish RampbugFix ABI18 build output'
            git -C "$buildrepo" pull --rebase origin main
            git -C "$buildrepo" push
          fi
